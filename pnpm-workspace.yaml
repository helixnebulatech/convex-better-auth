packages:
  - "."
  - examples/*
  - e2e
  - docs

# Do not install dependency versions published less than 7 days ago. To pull an
# urgent fix earlier, add the package to minimumReleaseAgeExclude.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Patched transitive versions (GHSA-p6vx-979v-rg4c, GHSA-jp82-f5mq-hwhp,
# GHSA-pqg4-j6r4-53mv). Drop once solid-js >=1.9.16 and concurrently >=10.0.6
# are older than minimumReleaseAge.
overrides:
  seroval@<1.6.3: ^1.6.3
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
