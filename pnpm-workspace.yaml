packages:
  - "."
  - examples/*
  - e2e
  - docs

# Do not install dependency versions published less than 3 days ago, as the
# Vercel AI SDK does. To pull an urgent fix earlier, add its exact version to
# minimumReleaseAgeExclude.
minimumReleaseAge: 4320

# One-time exception for Better Auth 1.7.13, published 2026-10-25. Exact
# versions only, so later releases wait the full 3 days. Drop these entries
# once they're older than minimumReleaseAge (2026-10-28).
minimumReleaseAgeExclude:
  - better-auth@1.7.13
  - "@better-auth/core@1.7.13"
  - "@better-auth/drizzle-adapter@1.7.13"
  - "@better-auth/kysely-adapter@1.7.13"
  - "@better-auth/memory-adapter@1.7.13"
  - "@better-auth/mongo-adapter@1.7.13"
  - "@better-auth/prisma-adapter@1.7.13"
  - "@better-auth/telemetry@1.7.13"
  - "@better-auth/test-utils@1.7.13"
  - "@better-auth/utils@0.5.1"
  - better-call@1.4.4
  - "@better-fetch/fetch@1.3.3"

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Patched transitive versions (GHSA-p6vx-979v-rg4c, GHSA-jp82-f5mq-hwhp,
# GHSA-pqg4-j6r4-53mv). Drop once solid-js >=1.9.16 and concurrently >=10.0.6
# are older than minimumReleaseAge.
overrides:
  seroval@<1.6.3: ^1.6.3
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
