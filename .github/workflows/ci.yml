name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The release workflow dispatches this for the "chore: release" pull
  # request, which GITHUB_TOKEN opens without triggering pull_request runs.
  workflow_dispatch:

permissions: {}

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Required by the `main` ruleset under this name.
    name: Test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run check

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Lint package
        run: bun run publint

      - name: Unit tests
        run: bun run test

      - name: Publish package for testing branch
        working-directory: packages/convex-better-auth
        run:
          bun x pkg-pr-new publish || echo "Have you set up pkg-pr-new for this
          repo?"

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      # Chromium runs with its sandbox on. Ubuntu 24.04 blocks the
      # unprivileged user namespaces the sandbox needs unless AppArmor allows them.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Playwright browsers
        working-directory: e2e
        run: bun x playwright install --with-deps chromium firefox

      - name: Build
        run: bun run build

      - name: End-to-end tests
        working-directory: e2e
        run: bun run test
