# Versioning and npm publishing with Changesets.
#
# Same model as Better Auth and the Vercel AI SDK: npm Trusted Publishing
# (OIDC, no npm token stored anywhere), provenance, and a `Release`
# environment that only `main` can deploy to. The work is split into jobs so
# that only `publish` can publish to npm, and it neither runs project code nor
# writes to the repo: it uploads the tarballs that `pack` built and tested.
#
#   select-mode -> version   (opens or updates the "chore: release" PR)
#               -> pack      (build, test, npm pack; no secrets)
#                  -> publish (Release environment: npm publish, read-only)
#                     -> github-release (tag, release, provenance; no npm token)
#
# A manual run with "snapshot" checked publishes a snapshot instead. One-time
# setup is described in FORK.md ("Release").
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Publish a snapshot release instead of a normal release"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    if: >
      github.repository == 'helixnebulatech/convex-better-auth' &&
      inputs.snapshot != true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id:
        ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # dispatch CI for the release pull request
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Create or update the release pull request
        id: version
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: bun run ci:version
          commit-message: "chore: release"
          pr-title: "chore: release"

      # Pull requests opened by GITHUB_TOKEN do not trigger workflows, so run
      # the checks the `main` ruleset requires on the release branch explicitly.
      - name: Run checks on the release pull request
        if: steps.version.outputs.pr-number != ''
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run verify-changesets.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Lint package
        run: bun run publint

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id:
            ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only `main` may deploy to this environment (Settings > Environments),
    # and npm's Trusted Publisher accepts tokens from this environment only.
    # The job holding the npm OIDC token can't write to the repo and runs no
    # project code: no lifecycle scripts, no build, only the tarball `pack`
    # built. The github-release job writes the tag and the release.
    environment: Release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    outputs:
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      # npm >= 11.5.1 is required for Trusted Publishing; Node 24 ships it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Publish to npm
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: false
          push-git-tags: false

  # Tag, GitHub Release and provenance for what was published, outside the
  # environment and without the npm OIDC token.
  github-release:
    name: GitHub Release
    needs: publish
    if:
      needs.publish.outputs.published-packages != '[]' &&
      needs.publish.outputs.published-packages != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create GitHub Release
        run: node .github/scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.published-packages }}

      - name: Attach SLSA provenance to GitHub Releases
        run: node .github/scripts/upload-provenance.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.published-packages }}

  # Snapshot release, also through the protected environment (and so only
  # from main). Publishes 0.0.0-<sha>-<timestamp> under the `snapshot` tag.
  snapshot:
    name: Snapshot Release
    if: >
      github.repository == 'helixnebulatech/convex-better-auth' &&
      inputs.snapshot == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Version packages (snapshot)
        run: |
          bun run changeset version --snapshot "${GITHUB_SHA::8}"
          bun run --cwd packages/convex-better-auth sync-version

      - name: Build
        run: bun run build

      - name: Publish snapshot
        run: bun run changeset publish --no-git-tag --tag snapshot
