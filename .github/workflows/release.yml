name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Publish a snapshot release instead of a normal release"
        type: boolean
        default: false

concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: false

permissions: {}

jobs:
  # Opens or updates the "Version Packages" pull request while there are
  # changesets. No environment: it never publishes, so it needs no approval
  # and never holds the npm OIDC token.
  version:
    name: Version Packages PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # dispatch CI for the "Version Packages" pull request
      actions: write
    # do not attempt running in forks; a manual normal release only from main
    if: >
      github.repository_owner == 'helixnebulatech' && inputs.snapshot != true &&
      github.ref == 'refs/heads/main'
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Without a publish script the action only versions: with no changesets
      # left it does nothing and the publish job takes over.
      - name: Create or update the Version Packages pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm ci:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests opened by GITHUB_TOKEN do not trigger workflows, so run
      # the required checks on the "Version Packages" branch explicitly.
      - name: Run checks on the release pull request
        if: steps.changesets.outputs.pr-number != ''
        run: |
          gh workflow run test.yml --ref changeset-release/main
          gh workflow run verify-changesets.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Publishes once the "Version Packages" pull request is merged (no
  # changesets left). Like Better Auth's release workflow, publishing runs in
  # the protected "Release" environment (required reviewer, main only), which
  # npm trusted publishing is bound to, with read-only contents and the OIDC
  # token only.
  publish:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Release
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance
      id-token: write
    outputs:
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # changeset publish only publishes a version that isn't on npm yet, so a
      # re-run is safe. What it published is the package.json version when
      # npm didn't have it before; its output isn't parsed, as its format
      # changes between changesets versions (3.x dropped the "New tag:"
      # lines). A stale "not on npm" only re-runs the GitHub Release job,
      # which leaves an existing release as is.
      - name: Publish
        id: publish
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          if npm view "$name@$version" version --prefer-online 2>/dev/null | grep -qxF "$version"; then
            packages='[]'
          else
            packages="$(jq -nc --arg name "$name" --arg version "$version" '[{name: $name, version: $version}]')"
          fi
          pnpm ci:release
          echo "published-packages=$packages" >> "$GITHUB_OUTPUT"

  # Tag, GitHub Release and provenance for what was published, outside the
  # environment (it needs to write, not to publish).
  github-release:
    name: GitHub Release
    needs: publish
    if: needs.publish.outputs.published-packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        run: node .github/scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.published-packages }}

      - name: Attach SLSA provenance to GitHub Releases
        run: node .github/scripts/upload-provenance.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.published-packages }}

  # Snapshot release path, also through the protected environment (and so
  # only from main).
  snapshot:
    name: Snapshot Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Release
    permissions:
      contents: read
      id-token: write
    if: github.repository_owner == 'helixnebulatech' && inputs.snapshot == true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Version Packages (snapshot)
        run: |
          pnpm changeset version --snapshot "${GITHUB_SHA::8}"
          node scripts/sync-version.mjs

      - name: Build
        run: rm -rf dist ./*.tsbuildinfo && pnpm run build

      - name: Publish Snapshot Release
        run: pnpm changeset publish --no-git-tag --tag snapshot
