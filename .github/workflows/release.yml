name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Publish a snapshot release instead of a normal release"
        type: boolean
        default: false

concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # npm trusted publishing (OIDC) and provenance
      id-token: write
      contents: write
      pull-requests: write
    # do not attempt running in forks
    if: github.repository_owner == 'helixnebulatech'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Normal release path. Opens or updates the "Version Packages" pull
      # request while there are changesets, and publishes once it is merged.
      - name: Create Release Pull Request or Publish to npm
        if: inputs.snapshot != true
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm ci:version
          publish-script: pnpm ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Snapshot release path
      - name: Version Packages (snapshot)
        if: inputs.snapshot == true
        run: |
          pnpm changeset version --snapshot "${GITHUB_SHA::8}"
          node scripts/sync-version.mjs

      - name: Build
        if: inputs.snapshot == true
        run: rm -rf dist *.tsbuildinfo && pnpm run build

      - name: Publish Snapshot Release
        if: inputs.snapshot == true
        run: pnpm changeset publish --no-git-tag --tag snapshot
