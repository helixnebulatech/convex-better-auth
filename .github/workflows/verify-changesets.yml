# Changes to the published package (src/**) need a changeset. Run
# `pnpm changeset` to add one, or `pnpm changeset --empty` for changes that do
# not need a release.
name: Verify Changesets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-changesets:
    name: Verify Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The "Version Packages" pull request consumes the changesets
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Check for changesets
        run: pnpm changeset status --since="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
