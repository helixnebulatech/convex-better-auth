# Changes to the published package (packages/convex-better-auth/src) need a
# changeset. Run `bun run changeset` to add one, or `bun run changeset --empty`
# for changes that do not need a release.
name: Verify Changesets

on:
  pull_request:
    branches:
      - main
  # Dispatched by the release workflow for the "chore: release" pull request.
  # The job is skipped there, which still satisfies the required check.
  workflow_dispatch:

permissions: {}

jobs:
  verify-changesets:
    # Required by the `main` ruleset under this name.
    name: Verify Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # The release pull request consumes the changesets
    if:
      github.event_name == 'pull_request' && !startsWith(github.head_ref,
      'changeset-release/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Check for changesets
        run: bun run changeset status --since="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
