name: Test and lint
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json
      - name: pnpm setup
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Publish package for testing branch
        run:
          pnpm exec pkg-pr-new publish || echo "Have you set up pkg-pr-new for
          this repo?"
      - name: Test
        run: |
          pnpm run test
          pnpm run typecheck
          pnpm run lint
      - name: Install Playwright browsers
        run: cd e2e && pnpm exec playwright install --with-deps chromium firefox
      - name: Run e2e tests
        run: cd e2e && pnpm run test
